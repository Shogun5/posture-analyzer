<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECT Icon Maker</title>
<style>body{font:15px system-ui;margin:16px;background:#f8fafc;color:#0f172a}canvas{border:1px solid #ccc;margin:8px;max-width:45vw}button{padding:8px 14px;margin:4px}.round{border-radius:50%}</style>
</head>
<body>
<h1>PWA 圖示產生器（ECT）</h1>
<p>用本機伺服器開啟此頁（需 http/https），按下載後把兩個 PNG 放到 <code>icons/</code>。要改設計請編輯 <code>tools/icon-draw.mjs</code>。</p>
<canvas id="c192" width="192" height="192"></canvas><canvas id="c512" width="512" height="512"></canvas>
<canvas id="mask" class="round" width="512" height="512" title="Android 圓形遮罩預覽"></canvas><br>
<button id="d192">下載 icon-192.png</button>
<button id="d512">下載 icon-512.png</button>
<script type="module">
import { drawIcon } from './icon-draw.mjs';
for (const id of ['c192', 'c512', 'mask']) { const c = document.getElementById(id); drawIcon(c.getContext('2d'), c.width); }
const dl = (id, name) => { const a = document.createElement('a'); a.href = document.getElementById(id).toDataURL('image/png'); a.download = name; a.click(); };
document.getElementById('d192').onclick = () => dl('c192', 'icon-192.png');
document.getElementById('d512').onclick = () => dl('c512', 'icon-512.png');
</script>
</body>
</html>
